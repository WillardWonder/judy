<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd9ea" />
  <title>Judy's Pony World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game" aria-label="Judy's pony game">
    <section id="world" class="world meadow" aria-label="Pony play area">
      <div class="sky-glow" aria-hidden="true"></div>
      <div class="rainbow" aria-hidden="true"></div>
      <div class="cloud cloud-a" aria-hidden="true"></div>
      <div class="cloud cloud-b" aria-hidden="true"></div>
      <div class="hill hill-a" aria-hidden="true"></div>
      <div class="hill hill-b" aria-hidden="true"></div>
      <div class="fence" aria-hidden="true"></div>
      <div class="barn" aria-hidden="true"><i></i></div>
      <div class="flowers f1" aria-hidden="true">✿</div>
      <div class="flowers f2" aria-hidden="true">✿</div>
      <div class="flowers f3" aria-hidden="true">✿</div>
      <div class="butterfly b1" aria-hidden="true">♥</div>
      <div class="butterfly b2" aria-hidden="true">♥</div>

      <header class="top">
        <div class="brand" aria-label="Judy's Pony World">
          <span class="brand-heart" aria-hidden="true">♥</span>
          <span class="brand-name">Judy's</span>
        </div>
        <button id="parentButton" class="gear" type="button" aria-label="Grown-up settings">⚙</button>
      </header>

      <div id="horseStrip" class="pony-picker" aria-label="Choose a pony"></div>

      <button id="ponyTap" class="pony-stage" type="button" aria-label="Play with pony">
        <span id="ponyName" class="pony-name">Rosie</span>
        <span id="loveBurst" class="love-burst" aria-hidden="true"></span>

        <svg id="ponySvg" class="pony" viewBox="0 0 520 500" role="img" aria-label="Cute pony">
          <defs>
            <filter id="softShadow" x="-30%" y="-30%" width="170%" height="180%">
              <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#6d4662" flood-opacity=".20"/>
            </filter>
            <linearGradient id="ponyBodyShade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--body-light)"/>
              <stop offset="1" stop-color="var(--body-color)"/>
            </linearGradient>
          </defs>

          <ellipse cx="265" cy="438" rx="148" ry="24" fill="#5d4761" opacity=".12"/>

          <g id="ponyArt" filter="url(#softShadow)">
            <!-- tail -->
            <g class="tail mane-fill">
              <path d="M150 266c-58-22-101 1-110 45 23-11 45-9 63 5-30 10-46 31-48 62 23-21 47-28 72-20-17 18-22 40-15 65 35-25 56-63 59-113 1-22-6-36-21-44z"/>
              <path d="M122 285c-36 3-55 21-58 46 19-9 39-6 57 10 14-20 14-39 1-56z" opacity=".72"/>
            </g>

            <!-- body -->
            <ellipse class="body-fill" cx="245" cy="291" rx="132" ry="96"/>
            <path class="body-fill" d="M319 288c5-57 20-106 47-148 14-22 37-36 65-37 37-1 67 26 68 61 2 37-25 67-65 74-27 5-43 18-52 43l-17 51z"/>

            <!-- legs -->
            <path class="body-fill" d="M154 338c-2 40-1 77 4 96 4 17 39 17 44-1 5-19 1-60 0-93z"/>
            <path class="body-fill" d="M229 350c0 38 1 70 7 86 6 16 39 15 43-2 4-17-1-55-3-88z"/>
            <path class="body-fill" d="M296 348c1 37 2 69 9 85 6 16 39 14 42-4 3-17-3-54-5-87z"/>
            <path class="body-fill" d="M350 328c2 43 6 81 13 99 7 17 39 13 40-6 1-18-8-62-12-99z"/>

            <!-- hooves -->
            <path class="hoof" d="M157 419c15 9 30 9 45 0l1 18c-9 16-34 18-45 1z"/>
            <path class="hoof" d="M234 419c14 9 29 9 44 0l1 18c-9 16-34 18-44 1z"/>
            <path class="hoof" d="M302 418c14 9 29 9 44 0l1 17c-8 16-33 19-43 2z"/>
            <path class="hoof" d="M360 411c14 8 28 7 42-2l2 17c-7 17-32 21-42 3z"/>

            <!-- neck mane -->
            <path class="mane-fill" d="M354 145c-29 37-40 78-36 123 15-13 30-19 45-19-12 15-15 31-8 48 13-15 27-23 43-23-11 17-11 34-3 50 27-27 43-60 46-99 4-45-7-81-35-108z"/>

            <!-- head -->
            <ellipse class="body-fill" cx="427" cy="155" rx="74" ry="70" transform="rotate(-9 427 155)"/>
            <ellipse class="muzzle" cx="465" cy="184" rx="45" ry="32" transform="rotate(-7 465 184)"/>

            <!-- ears -->
            <path class="body-fill" d="M384 109c-16-22-22-48-16-78 25 16 41 40 45 70z"/>
            <path class="body-fill" d="M441 94c4-26 16-48 36-66 9 28 6 54-8 76z"/>
            <path class="ear-inner" d="M383 92c-8-14-11-29-8-44 13 11 22 25 25 42z"/>
            <path class="ear-inner" d="M452 87c5-15 12-27 22-36 2 16 0 30-8 42z"/>

            <!-- forelock -->
            <path class="mane-fill" d="M379 103c21-27 52-33 83-17-15 0-27 7-35 20 17-5 31-2 43 8-17 1-30 8-38 20-14-17-32-27-53-31z"/>

            <!-- face -->
            <ellipse class="eye" cx="426" cy="150" rx="11" ry="15"/>
            <ellipse cx="430" cy="145" rx="4" ry="5" fill="#fff"/>
            <path class="lash" d="M416 139l-7-6M418 135l-3-8M439 138l6-7"/>
            <circle class="blush" cx="444" cy="176" r="12"/>
            <ellipse class="nostril" cx="484" cy="180" rx="5" ry="3.5"/>
            <path class="smile" d="M459 199c11 9 23 10 35 1"/>

            <!-- body shine -->
            <path d="M166 258c42-35 99-42 146-18" fill="none" stroke="#fff" stroke-opacity=".30" stroke-width="10" stroke-linecap="round"/>
          </g>

          <!-- markings -->
          <g id="markStar" class="mark hidden"><path d="M419 112l7 13 15 2-11 11 3 15-14-7-13 7 2-15-10-11 14-2z"/></g>
          <g id="markBlaze" class="mark hidden"><path d="M414 104c16 18 18 39 7 62-5 10-5 21-1 33-12-3-22-9-29-18 11-25 13-51 23-77z"/></g>
          <g id="markDapples" class="mark hidden" opacity=".52"><circle cx="182" cy="279" r="13"/><circle cx="219" cy="248" r="10"/><circle cx="262" cy="274" r="15"/><circle cx="302" cy="248" r="10"/><circle cx="324" cy="302" r="11"/><circle cx="217" cy="321" r="9"/></g>
          <g id="markSocks" class="mark hidden"><path d="M156 388h47v34c-15 8-31 8-47 0z"/><path d="M301 386h46v34c-15 8-30 8-46 0z"/></g>

          <!-- accessories -->
          <g id="accBow" class="acc hidden">
            <circle cx="368" cy="118" r="13" fill="#ff66aa"/>
            <path d="M359 117c-31-25-51-7-36 14 10 14 28 7 36-14z" fill="#ff96c6"/>
            <path d="M377 117c31-25 51-7 36 14-10 14-28 7-36-14z" fill="#ff96c6"/>
          </g>
          <g id="accFlower" class="acc hidden" transform="translate(376 111)">
            <circle r="8" fill="#ffd95f"/><circle cy="-13" r="9" fill="#fff"/><circle cx="12" cy="-4" r="9" fill="#fff"/><circle cx="7" cy="11" r="9" fill="#fff"/><circle cx="-7" cy="11" r="9" fill="#fff"/><circle cx="-12" cy="-4" r="9" fill="#fff"/>
          </g>
          <g id="accCrown" class="acc hidden"><path d="M390 94l10-35 20 26 21-34 12 40z" fill="#ffd75e" stroke="#e8af39" stroke-width="4"/><circle cx="422" cy="77" r="5" fill="#ff70ad"/></g>
          <g id="accHalter" class="acc hidden" fill="none" stroke="#ff6dae" stroke-width="7" stroke-linecap="round"><path d="M391 137c20 18 47 23 80 16"/><path d="M398 171c23 12 47 13 73 4"/><path d="M406 138l-8 33"/><path d="M464 151l7 27"/></g>
          <g id="accBlanket" class="acc hidden"><path d="M145 248c60-37 134-40 199-8l-15 104c-62 29-126 28-190-2z" fill="#ffb9d9" stroke="#fff7fb" stroke-width="8"/><path d="M164 258c53 19 106 19 159 0" fill="none" stroke="#aa8ae4" stroke-width="8" stroke-linecap="round"/><path d="M210 298l12 12 12-12 12 12 12-12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>
          <g id="accWings" class="acc hidden"><path d="M232 238c-58-87-125-58-99 6 18 44 64 53 113 39-27-8-45-22-56-42 18 9 32 8 42-3z" fill="#faf3ff" stroke="#d5c4f5" stroke-width="6"/><path d="M248 254c-46-52-90-30-73 16 12 34 46 42 81 32-19-7-32-18-39-32 14 6 24 3 31-16z" fill="#fff" opacity=".95"/></g>
        </svg>
      </button>

      <nav class="dock" aria-label="Pony actions">
        <button class="toy-button feed" data-action="feed" type="button" aria-label="Give an apple"><span>🍎</span></button>
        <button class="toy-button brush" data-action="brush" type="button" aria-label="Brush pony"><span class="brush-icon" aria-hidden="true"></span></button>
        <button class="toy-button ride" data-action="ride" type="button" aria-label="Ride pony"><span>🐎</span></button>
        <button class="toy-button dress" data-action="dress" type="button" aria-label="Dress up pony"><span>🎀</span></button>
      </nav>
    </section>
  </main>

  <dialog id="closet" class="drawer">
    <div class="drawer-card">
      <button id="closeCloset" class="close" type="button" aria-label="Close">×</button>
      <div id="closetGrid" class="closet-grid" aria-label="Pick an accessory"></div>
      <div class="scene-picks" aria-label="Pick a place">
        <button data-scene="meadow" class="scene meadow-pick" type="button" aria-label="Flower meadow"><span>🌸</span></button>
        <button data-scene="stable" class="scene stable-pick" type="button" aria-label="Cozy stable"><span>🏠</span></button>
        <button data-scene="show" class="scene show-pick" type="button" aria-label="Horse show"><span>🏆</span></button>
      </div>
    </div>
  </dialog>

  <dialog id="parentSheet" class="parent-sheet">
    <div class="parent-card">
      <button id="closeParent" class="close" type="button" aria-label="Close">×</button>
      <h2>Grown-up settings</h2>
      <p>Judy's pony saves automatically on this browser.</p>
      <button id="exportSave" type="button">Export backup</button>
      <label>Import backup<input id="importSave" type="file" accept="application/json" /></label>
      <button id="resetGame" class="danger" type="button">Start over</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
